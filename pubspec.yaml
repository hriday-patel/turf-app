name: turf_app
description: A production-ready mobile app for booking Box Cricket / Turf slots.
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.11
  http: ^1.2.2

  # State Management
  provider: ^6.1.1

  # UI Components
  google_fonts: ^6.1.0

  # Date & Time Pickers
  table_calendar: ^3.0.9

  # Image Handling
  image_picker: ^1.0.7

  # Utilities
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  shared_preferences: ^2.5.4

  # Charts
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
